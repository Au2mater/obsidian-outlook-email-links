# Publishes a GitHub release when a version tag (x.y.z) is pushed, with build
# provenance attestations for the release assets.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, build and test
        run: |
          npm ci
          npm run build
          npm test

      - name: Check the tag matches the version files
        run: |
          for file in manifest.json package.json; do
            version=$(node -p "require('./$file').version")
            if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $file version $version" >&2
              exit 1
            fi
          done
          node -e "if (!require('./versions.json')[process.argv[1]]) { console.error('versions.json has no entry for ' + process.argv[1]); process.exit(1) }" "$GITHUB_REF_NAME"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json \
            --title "$GITHUB_REF_NAME" --generate-notes
